# Docker-specific configuration
server:
  port: 8080

spring:
  application:
    name: cql-platform

  # H2 In-Memory Database for Docker
  datasource:
    url: jdbc:h2:mem:cqlplatform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false

  h2:
    console:
      enabled: false

# FHIR Configuration for Docker environment
fhir:
  server:
    url: ${FHIR_SERVER_URL:http://launch.smarthealthit.org/v/r4/fhir}
  terminology:
    url: ${FHIR_TERMINOLOGY_URL:http://tx.fhir.org/r4}

# Logging
logging:
  level:
    com.cqlplatform: DEBUG
    org.opencds.cqf: INFO
    ca.uhn.fhir: INFO
    ca.uhn.fhir.rest.client: DEBUG
