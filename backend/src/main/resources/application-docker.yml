# Docker profile - PostgreSQL database
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/cqlplatform}
    username: ${DB_USERNAME:cqlplatform}
    password: ${DB_PASSWORD:cqlplatform}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

# FHIR Configuration for Docker environment
fhir:
  server:
    url: ${FHIR_SERVER_URL:http://launch.smarthealthit.org/v/r4/fhir}
  terminology:
    url: ${FHIR_TERMINOLOGY_URL:https://tx.fhir.org/r4}

# Logging
logging:
  level:
    com.cqlplatform: DEBUG
    org.opencds.cqf: INFO
    ca.uhn.fhir: INFO
    org.flywaydb: INFO
