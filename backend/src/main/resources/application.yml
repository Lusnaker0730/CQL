# Build/deploy metadata exposed via /api/version for SPA cache-bust detection.
# APP_COMMIT_SHA should be injected at deploy time (docker-compose env, CI pipeline).
# Missing values default to "unknown"; frontend only cares the value *changes* across
# deploys, not its content — startup timestamp (captured in controller) is the primary
# change signal.
app:
  commit-sha: ${APP_COMMIT_SHA:unknown}
  version: ${APP_VERSION:1.0.0-SNAPSHOT}
  security:
    lockout:
      # Password-lockout thresholds (PAT-094). After N consecutive failed logins the
      # account is locked for the configured duration. Both values are overridable
      # per environment via APP_SECURITY_LOCKOUT_MAX_ATTEMPTS / _DURATION_MINUTES.
      # Defaults balance "stop brute-force" (low number locks quickly) against
      # "don't lock out the clumsy user on every typo day" (high number tolerates
      # normal mistakes). Admin can clear the counter manually via POST /api/admin/users/{id}/unlock.
      max-attempts: ${APP_SECURITY_LOCKOUT_MAX_ATTEMPTS:5}
      duration-minutes: ${APP_SECURITY_LOCKOUT_DURATION_MINUTES:30}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
  # TLS/HTTPS Configuration - uncomment and provide keystore for production
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: ${SSL_KEYSTORE_PASSWORD}
  #   key-store-type: PKCS12
  #   key-alias: cqlplatform

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: cql-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Default datasource - PostgreSQL (overridden by dev profile for H2)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cqlplatform}
    username: ${DB_USERNAME:cqlplatform}
    password: ${DB_PASSWORD:cqlplatform}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000        # 5 minutes
      max-lifetime: 600000        # 10 minutes
      connection-timeout: 20000   # 20 seconds
      leak-detection-threshold: 60000  # log warning if connection held > 60s
      pool-name: CqlPlatformPool

  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    lock-retry-count: ${FLYWAY_LOCK_RETRY_COUNT:10}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 min
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days
  absolute-session-ms: ${JWT_ABSOLUTE_SESSION:2592000000}     # 30 days
  expiration-ms: ${JWT_EXPIRATION:900000}                     # backward compat alias

refresh-token:
  cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}

# Rate Limiting
rate-limit:
  enabled: true
  requests-per-minute: ${RATE_LIMIT_RPM:60}
  # Per-tier IP limits
  translate-rpm: ${RATE_LIMIT_TRANSLATE_RPM:20}
  execute-rpm: ${RATE_LIMIT_EXECUTE_RPM:10}
  fix-suggestion-rpm: ${RATE_LIMIT_FIX_SUGGESTION_RPM:5}
  library-read-rpm: ${RATE_LIMIT_LIBRARY_READ_RPM:120}
  cds-discovery-rpm: ${RATE_LIMIT_CDS_DISCOVERY_RPM:20}
  # Per-user limits
  user-limit-enabled: ${RATE_LIMIT_USER_ENABLED:true}
  user-translate-rpm: ${RATE_LIMIT_USER_TRANSLATE_RPM:15}
  user-execute-rpm: ${RATE_LIMIT_USER_EXECUTE_RPM:8}
  user-fix-suggestion-rpm: ${RATE_LIMIT_USER_FIX_SUGGESTION_RPM:3}
  user-default-rpm: ${RATE_LIMIT_USER_DEFAULT_RPM:40}
  # Payload weighting thresholds (bytes)
  payload-tier2: 10240
  payload-tier3: 51200
  payload-tier4: 204800

# PHI Encryption
encryption:
  secret-key: ${ENCRYPTION_KEY}

# SMART on FHIR Configuration
smart:
  issuer: ${SMART_ISSUER:http://localhost:8080}
  authorization-endpoint: ${SMART_AUTH_ENDPOINT:http://localhost:8080/api/auth/login}
  token-endpoint: ${SMART_TOKEN_ENDPOINT:http://localhost:8080/api/auth/login}

# Okta SSO Configuration
okta:
  enabled: ${OKTA_ENABLED:false}
  client-id: ${OKTA_CLIENT_ID:}
  client-secret: ${OKTA_CLIENT_SECRET:}
  issuer: ${OKTA_ISSUER:}

# AI Fix Suggestion — multi-provider support
ai:
  provider: ${AI_PROVIDER:none}
  ollama-url: ${OLLAMA_URL:http://localhost:11434}
  ollama-model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
  ollama-timeout-seconds: ${OLLAMA_TIMEOUT:120}
  cloud-api-url: ${AI_CLOUD_API_URL:https://api.openai.com/v1/chat/completions}
  cloud-model: ${AI_CLOUD_MODEL:gpt-4o-mini}
  cloud-api-key: ${AI_CLOUD_API_KEY:}
  cloud-timeout-seconds: ${AI_CLOUD_TIMEOUT:60}

# Legacy Ollama config — kept for backward compatibility
ollama:
  enabled: ${OLLAMA_ENABLED:false}

# CQL Platform Configuration
cql:
  translation:
    enable-annotations: true
    enable-locators: true
    enable-result-types: true
    validate-units: true
    signature-level: All
  execution:
    debug-mode: false
    enable-expression-caching: true
    timeout-seconds: 120
    translation-timeout-seconds: 30
    measure-timeout-seconds: 120
    thread-pool-size: 10
    max-pool-size: 20
    queue-capacity: 50
    max-retrieve-count: 10000
    max-collection-size: 1000
    max-patient-count: 50000

# FHIR Configuration
fhir:
  server:
    url: ${FHIR_SERVER_URL:http://hapi-fhir:8080/fhir}
  terminology:
    url: ${FHIR_TERMINOLOGY_URL:https://tx.fhir.org/r4}
  implementation-guides:
    enabled: ${FHIR_IG_ENABLED:true}
  subscription:
    callback-base-url: ${FHIR_SUBSCRIPTION_CALLBACK_URL:}
  client:
    pool-max-total: 50
    pool-default-per-route: 30
    connect-timeout-ms: 5000
    socket-timeout-ms: 15000
    connection-request-timeout-ms: 5000

# VSAC Configuration
vsac:
  api:
    url: ${VSAC_API_URL:https://cts.nlm.nih.gov/fhir/}
    key: ${VSAC_API_KEY:}

# CDS Hooks Configuration
cds:
  hooks:
    enabled: true

# Measure Configuration
measure:
  reporting:
    default-period-start: ${MEASURE_DEFAULT_PERIOD_START:}
    default-period-end: ${MEASURE_DEFAULT_PERIOD_END:}
  locking:
    timeout-minutes: ${MEASURE_LOCK_TIMEOUT_MINUTES:30}
  scheduling:
    enabled: ${MEASURE_SCHEDULING_ENABLED:true}

# EHR Import Configuration
ehr:
  import:
    max-retry-attempts: ${EHR_IMPORT_MAX_RETRIES:3}
    retry-initial-delay-seconds: ${EHR_IMPORT_RETRY_DELAY:60}
    retry-check-interval-ms: ${EHR_IMPORT_RETRY_CHECK_INTERVAL:60000}
    # Dedicated thread pool for bulk patient imports so they cannot starve the CQL execution
    # pool. AbortPolicy: if queue (100) overflows, the submitting /api/ehr/import request
    # fails fast with 503 rather than blocking a Tomcat thread for minutes.
    thread-pool-size: ${EHR_IMPORT_THREAD_POOL_SIZE:4}
    max-pool-size: ${EHR_IMPORT_MAX_POOL_SIZE:8}
    queue-capacity: ${EHR_IMPORT_QUEUE_CAPACITY:100}
  health:
    check-interval-ms: ${EHR_HEALTH_CHECK_INTERVAL:900000}
    check-interval-minutes: ${EHR_HEALTH_CHECK_MINUTES:15}
    retention-days: ${EHR_HEALTH_RETENTION_DAYS:7}

# Audit Configuration
audit:
  retention-days: ${AUDIT_RETENTION_DAYS:365}

# Logging
logging:
  level:
    com.cqlplatform: INFO
    org.opencds.cqf: INFO
    ca.uhn.fhir: INFO

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - ca.uhn.fhir.rest.client.exceptions.FhirClientConnectionException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - java.io.IOException
        ignoreExceptions:
          - ca.uhn.fhir.rest.server.exceptions.ResourceNotFoundException
    instances:
      fhirDataProvider:
        baseConfig: default
      fhirTerminology:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 60s
      vsacService:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 120s
      ollamaService:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
      cloudAiService:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 60s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - ca.uhn.fhir.rest.client.exceptions.FhirClientConnectionException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - java.io.IOException
        ignoreExceptions:
          - ca.uhn.fhir.rest.server.exceptions.ResourceNotFoundException
          - ca.uhn.fhir.rest.server.exceptions.InvalidRequestException
    instances:
      fhirDataProvider:
        baseConfig: default
        maxAttempts: 2
      fhirTerminology:
        baseConfig: default
        maxAttempts: 4
        waitDuration: 2s
      vsacService:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 3s
      ollamaService:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 2s
      cloudAiService:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 2s
