server:
  port: ${SERVER_PORT:8080}
  # TLS/HTTPS Configuration - uncomment and provide keystore for production
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: ${SSL_KEYSTORE_PASSWORD}
  #   key-store-type: PKCS12
  #   key-alias: cqlplatform

spring:
  application:
    name: cql-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Default datasource - PostgreSQL (overridden by dev profile for H2)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cqlplatform}
    username: ${DB_USERNAME:cqlplatform}
    password: ${DB_PASSWORD:cqlplatform}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:CQLPlatformSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong!!}
  expiration-ms: ${JWT_EXPIRATION:86400000}  # 24 hours

# Rate Limiting
rate-limit:
  enabled: true
  requests-per-minute: ${RATE_LIMIT_RPM:60}

# PHI Encryption
encryption:
  secret-key: ${ENCRYPTION_KEY:DefaultEncryptionKeyMustBeExactly32B}

# SMART on FHIR Configuration
smart:
  issuer: ${SMART_ISSUER:http://localhost:8080}
  authorization-endpoint: ${SMART_AUTH_ENDPOINT:http://localhost:8080/api/auth/login}
  token-endpoint: ${SMART_TOKEN_ENDPOINT:http://localhost:8080/api/auth/login}

# CQL Platform Configuration
cql:
  translation:
    enable-annotations: true
    enable-locators: true
    enable-result-types: true
    validate-units: true
    signature-level: All
  execution:
    debug-mode: false
    enable-expression-caching: true

# FHIR Configuration
fhir:
  server:
    url: ${FHIR_SERVER_URL:http://launch.smarthealthit.org/v/r4/fhir}
  terminology:
    url: ${FHIR_TERMINOLOGY_URL:http://tx.fhir.org/r4}

# CDS Hooks Configuration
cds:
  hooks:
    enabled: true
    services:
      - id: diabetes-management
        title: Diabetes Management
        description: CDS for diabetes patient management
        hook: patient-view
      - id: medication-check
        title: Medication Interaction Check
        description: Check for potential drug interactions
        hook: order-select

# Measure Configuration
measure:
  reporting:
    default-period-start: "2024-01-01"
    default-period-end: "2024-12-31"

# Logging
logging:
  level:
    com.cqlplatform: DEBUG
    org.opencds.cqf: INFO
    ca.uhn.fhir: INFO

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
