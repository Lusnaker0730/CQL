server:
  port: 8080

spring:
  application:
    name: cql-platform
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:file:./data/cqlplatform;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # H2 Console (for development)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

# CQL Platform Configuration
cql:
  translation:
    enable-annotations: true
    enable-locators: true
    enable-result-types: true
    validate-units: true
    signature-level: All
  execution:
    debug-mode: false
    enable-expression-caching: true

# FHIR Configuration
fhir:
  server:
    url: http://launch.smarthealthit.org/v/r4/fhir
  terminology:
    url: http://tx.fhir.org/r4

# CDS Hooks Configuration
cds:
  hooks:
    enabled: true
    services:
      - id: diabetes-management
        title: Diabetes Management
        description: CDS for diabetes patient management
        hook: patient-view
      - id: medication-check
        title: Medication Interaction Check
        description: Check for potential drug interactions
        hook: order-select

# Measure Configuration
measure:
  reporting:
    default-period-start: "2024-01-01"
    default-period-end: "2024-12-31"

# Logging
logging:
  level:
    com.cqlplatform: DEBUG
    org.opencds.cqf: INFO
    ca.uhn.fhir: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
