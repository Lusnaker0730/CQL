server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # TLS/HTTPS Configuration - uncomment and provide keystore for production
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: ${SSL_KEYSTORE_PASSWORD}
  #   key-store-type: PKCS12
  #   key-alias: cqlplatform

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: cql-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Default datasource - PostgreSQL (overridden by dev profile for H2)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cqlplatform}
    username: ${DB_USERNAME:cqlplatform}
    password: ${DB_PASSWORD:cqlplatform}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION:86400000}  # 24 hours

# Rate Limiting
rate-limit:
  enabled: true
  requests-per-minute: ${RATE_LIMIT_RPM:60}

# PHI Encryption
encryption:
  secret-key: ${ENCRYPTION_KEY}

# SMART on FHIR Configuration
smart:
  issuer: ${SMART_ISSUER:http://localhost:8080}
  authorization-endpoint: ${SMART_AUTH_ENDPOINT:http://localhost:8080/api/auth/login}
  token-endpoint: ${SMART_TOKEN_ENDPOINT:http://localhost:8080/api/auth/login}

# Okta SSO Configuration
okta:
  enabled: ${OKTA_ENABLED:false}
  client-id: ${OKTA_CLIENT_ID:}
  client-secret: ${OKTA_CLIENT_SECRET:}
  issuer: ${OKTA_ISSUER:}

# CQL Platform Configuration
cql:
  translation:
    enable-annotations: true
    enable-locators: true
    enable-result-types: true
    validate-units: true
    signature-level: All
  execution:
    debug-mode: false
    enable-expression-caching: true
    timeout-seconds: 120
    measure-timeout-seconds: 120
    thread-pool-size: 10
    max-pool-size: 20
    queue-capacity: 50

# FHIR Configuration
fhir:
  server:
    url: ${FHIR_SERVER_URL:http://hapi-fhir:8080/fhir}
  terminology:
    url: ${FHIR_TERMINOLOGY_URL:https://tx.fhir.org/r4}
  implementation-guides:
    enabled: ${FHIR_IG_ENABLED:true}
  client:
    pool-max-total: 20
    pool-default-per-route: 10
    connect-timeout-ms: 5000
    socket-timeout-ms: 30000

# VSAC Configuration
vsac:
  api:
    url: ${VSAC_API_URL:https://cts.nlm.nih.gov/fhir/}
    key: ${VSAC_API_KEY:}

# CDS Hooks Configuration
cds:
  hooks:
    enabled: true

# Measure Configuration
measure:
  reporting:
    default-period-start: ${MEASURE_DEFAULT_PERIOD_START:}
    default-period-end: ${MEASURE_DEFAULT_PERIOD_END:}
  locking:
    timeout-minutes: ${MEASURE_LOCK_TIMEOUT_MINUTES:30}
  scheduling:
    enabled: ${MEASURE_SCHEDULING_ENABLED:true}

# Audit Configuration
audit:
  retention-days: ${AUDIT_RETENTION_DAYS:365}

# Logging
logging:
  level:
    com.cqlplatform: INFO
    org.opencds.cqf: INFO
    ca.uhn.fhir: INFO

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - ca.uhn.fhir.rest.client.exceptions.FhirClientConnectionException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - java.io.IOException
        ignoreExceptions:
          - ca.uhn.fhir.rest.server.exceptions.ResourceNotFoundException
    instances:
      fhirDataProvider:
        baseConfig: default
      fhirTerminology:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 60s
      vsacService:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 120s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - ca.uhn.fhir.rest.client.exceptions.FhirClientConnectionException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - java.io.IOException
        ignoreExceptions:
          - ca.uhn.fhir.rest.server.exceptions.ResourceNotFoundException
          - ca.uhn.fhir.rest.server.exceptions.InvalidRequestException
    instances:
      fhirDataProvider:
        baseConfig: default
      fhirTerminology:
        baseConfig: default
        maxAttempts: 4
        waitDuration: 2s
      vsacService:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 3s
