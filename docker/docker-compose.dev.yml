# Development overlay - exposes all service ports for local debugging
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
version: '3.8'

services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8081:8080"

  frontend:
    ports:
      - "5173:80"

  hapi-fhir:
    ports:
      - "8090:8080"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"
