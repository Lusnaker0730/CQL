# TLS/HTTPS for twcql.com via Cloudflare Origin Certificate (PAT-096).
# Cert: 15-year validity, scoped to Cloudflare <-> origin only.
# Cloudflare SSL mode must be set to "Full (strict)" for this to validate end-to-end.
#
# Deploy target: /etc/nginx/sites-available/twcql.com on the VM (187.77.155.248),
# symlinked from /etc/nginx/sites-enabled/twcql.com. This file is the source of
# truth — edit here, copy to VM, `nginx -t && systemctl reload nginx`.

# Plain HTTP -> 301 redirect to HTTPS. Applies to both apex and www.
server {
    listen 80;
    listen [::]:80;
    server_name twcql.com www.twcql.com;
    return 301 https://$host$request_uri;
}

# HTTPS origin server. TLS 1.2/1.3 only; HSTS on; proxy to the containerized frontend on :8888.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twcql.com www.twcql.com;

    ssl_certificate     /etc/ssl/cloudflare/twcql.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/twcql.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: 6 months, include subdomains. Safe because CF also fronts HTTPS.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
}
