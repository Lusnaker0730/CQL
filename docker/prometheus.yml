global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager removed (BUG-120): the only receivers ever configured pointed at
# a non-existent webhook on localhost:9095 (placeholder scaffold, never implemented),
# so no alert was ever deliverable. Rules below still evaluate and surface firing
# alerts in the Prometheus UI (:9090/alerts); they are simply not pushed anywhere.
# To re-enable notifications, restore an `alerting:` block + a real receiver.
rule_files:
  - '/etc/prometheus/prometheus-alerts.yml'

scrape_configs:
  - job_name: 'cql-platform'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    # PAT-113: HTTP Basic auth. The username ships in the committed config;
    # the password is written to /tmp/scrape_password at container start by
    # the docker-compose entrypoint override (reads METRICS_SCRAPE_PASSWORD env).
    # If either side of auth is misconfigured the scrape fails → ServiceDown alert fires.
    basic_auth:
      username: 'prometheus'
      password_file: '/tmp/scrape_password'
    static_configs:
      - targets: ['backend:8080']
        labels:
          application: 'cql-platform'
