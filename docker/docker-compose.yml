services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backup:/backups
    networks:
      - cql-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      # WAL archiving. The dir is self-healed each call (mkdir -p) so a fresh
      # postgres-backup volume works without manual setup. The `test -f || cp`
      # form is idempotent (re-archiving an existing segment is a no-op success)
      # AND surfaces real copy failures — unlike the old `... || true`, which
      # masked every failure and let PostgreSQL recycle un-archived WAL into the
      # void (BUG: /backups/wal never existed + was root-owned → 0 WAL kept,
      # failed_count stayed 0). Requires /backups to be postgres-writable; a
      # fresh volume is root-owned, so `mkdir -p` fails LOUDLY (visible in the
      # postgres log + archiver failed_count) instead of silently — see
      # DEPLOYMENT_GUIDE §9 for the one-time `chown postgres /backups`.
      - "archive_command=mkdir -p /backups/wal && ( test -f /backups/wal/%f || cp %p /backups/wal/%f )"
      - "-c"
      - "max_wal_senders=3"

  backend:
    # Prod pulls the CI-built image from GHCR (deploy.yml pushes on every main CI).
    # `build:` is kept so local dev (`docker compose build backend`) still works.
    # Pin a specific build with BACKEND_IMAGE_TAG=sha-xxxxxxx in docker/.env (default: latest).
    image: ghcr.io/lusnaker0730/cql/backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FHIR_SERVER_URL=${FHIR_SERVER_URL}
      - FHIR_TERMINOLOGY_URL=${FHIR_TERMINOLOGY_URL}
      - VSAC_API_KEY=${VSAC_API_KEY:-}
      - OKTA_ENABLED=${OKTA_ENABLED:-false}
      - OKTA_CLIENT_ID=${OKTA_CLIENT_ID:-}
      - OKTA_CLIENT_SECRET=${OKTA_CLIENT_SECRET:-}
      - OKTA_ISSUER=${OKTA_ISSUER:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - SMART_ISSUER=${SMART_ISSUER:-}
      - SMART_AUTH_ENDPOINT=${SMART_AUTH_ENDPOINT:-}
      - SMART_TOKEN_ENDPOINT=${SMART_TOKEN_ENDPOINT:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      # Deploy-change detection for SPA cache-bust (see /api/version endpoint).
      # Set APP_COMMIT_SHA in the deploy environment (e.g. `APP_COMMIT_SHA=$(git rev-parse HEAD)`);
      # frontend treats backend startup time + this sha as the cache-bust signal.
      - APP_COMMIT_SHA=${APP_COMMIT_SHA:-unknown}
      - AI_PROVIDER=${AI_PROVIDER:-none}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - AI_CLOUD_API_URL=${AI_CLOUD_API_URL:-}
      - AI_CLOUD_MODEL=${AI_CLOUD_MODEL:-}
      - AI_CLOUD_API_KEY=${AI_CLOUD_API_KEY:-}
      # PAT-113: Prometheus scrape auth. Default-secure — if unset, /actuator/prometheus
      # returns 401 (and Prometheus logs scrape failures loudly). Generate with
      # `openssl rand -base64 24`; must match the value in the prometheus container env.
      - METRICS_SCRAPE_USER=${METRICS_SCRAPE_USER:-prometheus}
      - METRICS_SCRAPE_PASSWORD=${METRICS_SCRAPE_PASSWORD}
      # CQL execution thread pool — now tunable via docker/.env WITHOUT rebuilding
      # the image (previously baked into application.yml). Defaults preserve current
      # behaviour (10/20/50). On this 2-core VM, cql2elm + evaluate are CPU-bound;
      # if Grafana shows sustained CqlQueueSaturation or CPU thrash, lower these
      # (e.g. THREAD_POOL_SIZE=4 / MAX_POOL_SIZE=8) — no image rebuild needed.
      - CQL_EXECUTION_THREAD_POOL_SIZE=${CQL_EXECUTION_THREAD_POOL_SIZE:-10}
      - CQL_EXECUTION_MAX_POOL_SIZE=${CQL_EXECUTION_MAX_POOL_SIZE:-20}
      - CQL_EXECUTION_QUEUE_CAPACITY=${CQL_EXECUTION_QUEUE_CAPACITY:-50}
    depends_on:
      postgres:
        condition: service_healthy
      hapi-fhir:
        condition: service_started
    networks:
      - cql-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  frontend:
    # Prod pulls the CI-built image from GHCR; `build:` kept for local dev.
    # Pin with FRONTEND_IMAGE_TAG=sha-xxxxxxx in docker/.env (default: latest).
    image: ghcr.io/lusnaker0730/cql/frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - cql-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cql-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          cpus: '4.0'
          memory: 8G

  hapi-fhir:
    # Pinned by digest for reproducibility. `:latest` meant any `docker compose pull`
    # could silently upgrade the clinical FHIR data store — HAPI major bumps often
    # carry breaking schema migrations, with no clean rollback. This digest is the
    # image running in production as of 2026-07-07; bump it deliberately (and test)
    # when intentionally upgrading HAPI. To read the current tag:
    #   docker image inspect hapiproject/hapi@sha256:34c86f… --format '{{.RepoTags}}'
    image: hapiproject/hapi@sha256:34c86fd5805df77c2b9d9c10538050b16ac3dc244352da0ebe4717f931330775
    restart: unless-stopped
    environment:
      - hapi.fhir.default_encoding=json
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.allow_multiple_delete=false
      - hapi.fhir.reuse_cached_search_results_millis=-1
      - JAVA_TOOL_OPTIONS=-Xmx1536m
    volumes:
      - hapi-data:/data/hapi
    networks:
      - cql-network
    healthcheck:
      # Intentionally disabled: the hapiproject/hapi image is distroless — no shell,
      # curl or wget — so a container-level HTTP healthcheck cannot be expressed.
      # (Do NOT "restore" this with a CMD-SHELL check; it will fail on a missing sh.)
      # The backend tolerates HAPI unreadiness via its FHIR client retry + circuit
      # breaker (resilience4j), and depends_on uses service_started accordingly.
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    environment:
      - METRICS_SCRAPE_PASSWORD=${METRICS_SCRAPE_PASSWORD}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    # PAT-113: materialise the scrape password into a file the Prometheus binary
    # can read (basic_auth.password_file in prometheus.yml points at /tmp/scrape_password).
    # Doing this at entrypoint time keeps the plaintext out of any committed config
    # and out of the container's image layer.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        if [ -z "$$METRICS_SCRAPE_PASSWORD" ]; then
          echo "FATAL: METRICS_SCRAPE_PASSWORD env var is unset — Prometheus scrape will fail. Set it in docker/.env." >&2
          exit 1
        fi
        printf '%s' "$$METRICS_SCRAPE_PASSWORD" > /tmp/scrape_password
        chmod 600 /tmp/scrape_password
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=30d \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cql-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cql-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    environment:
      # BUG-120: Telegram delivery. Set both in docker/.env (gitignored).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # Mirror the Prometheus pattern: keep the bot token out of any committed config
    # and out of the image layer by writing it to a file at entrypoint time, and
    # render the deployment-specific chat_id into the config from env.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        if [ -z "$$TELEGRAM_BOT_TOKEN" ] || [ -z "$$TELEGRAM_CHAT_ID" ]; then
          echo "FATAL: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID unset — set them in docker/.env." >&2
          exit 1
        fi
        printf '%s' "$$TELEGRAM_BOT_TOKEN" > /tmp/telegram_token
        chmod 600 /tmp/telegram_token
        sed "s/__TELEGRAM_CHAT_ID__/$$TELEGRAM_CHAT_ID/g" \
          /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager
    depends_on:
      - prometheus
    networks:
      - cql-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  node-exporter:
    # Host-level metrics (disk / cpu / mem). The app-only Prometheus job was blind
    # to the VM itself filling up — the tail of the "unbounded logs / WAL / local
    # backups grow → disk full → postgres corruption" risk chain had NO alert.
    # Powers DiskSpaceLow / DiskSpaceCritical, and BackupStale via the textfile
    # collector (backup-db.sh writes cql_backup_last_success_timestamp_seconds there).
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/host/opt/CQL/docker/node-exporter-textfile'
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - cql-network
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 64M

  taiwan-fhir-generator:
    profiles: [twcore]
    build:
      context: ../TWCOREDATA
      dockerfile: Dockerfile
    container_name: taiwan-fhir-generator
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - FHIR_SERVER_URL=${FHIR_SERVER_URL}
    volumes:
      - ../TWCOREDATA/output:/app/output
      - ../TWCOREDATA/config:/app/config
    depends_on:
      hapi-fhir:
        condition: service_started
    networks:
      - cql-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  cql-network:
    driver: bridge

volumes:
  postgres-data:
  postgres-backup:
  hapi-data:
  ollama-data:
  prometheus-data:
  grafana-data:
