services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backup:/backups
    networks:
      - cql-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/%f || true"
      - "-c"
      - "max_wal_senders=3"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FHIR_SERVER_URL=${FHIR_SERVER_URL}
      - FHIR_TERMINOLOGY_URL=${FHIR_TERMINOLOGY_URL}
      - VSAC_API_KEY=${VSAC_API_KEY:-}
      - OKTA_ENABLED=${OKTA_ENABLED:-false}
      - OKTA_CLIENT_ID=${OKTA_CLIENT_ID:-}
      - OKTA_CLIENT_SECRET=${OKTA_CLIENT_SECRET:-}
      - OKTA_ISSUER=${OKTA_ISSUER:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - SMART_ISSUER=${SMART_ISSUER:-}
      - SMART_AUTH_ENDPOINT=${SMART_AUTH_ENDPOINT:-}
      - SMART_TOKEN_ENDPOINT=${SMART_TOKEN_ENDPOINT:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      # Deploy-change detection for SPA cache-bust (see /api/version endpoint).
      # Set APP_COMMIT_SHA in the deploy environment (e.g. `APP_COMMIT_SHA=$(git rev-parse HEAD)`);
      # frontend treats backend startup time + this sha as the cache-bust signal.
      - APP_COMMIT_SHA=${APP_COMMIT_SHA:-unknown}
      - AI_PROVIDER=${AI_PROVIDER:-none}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - AI_CLOUD_API_URL=${AI_CLOUD_API_URL:-}
      - AI_CLOUD_MODEL=${AI_CLOUD_MODEL:-}
      - AI_CLOUD_API_KEY=${AI_CLOUD_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      hapi-fhir:
        condition: service_started
    networks:
      - cql-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - cql-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cql-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          cpus: '4.0'
          memory: 8G

  hapi-fhir:
    image: hapiproject/hapi:latest
    restart: unless-stopped
    environment:
      - hapi.fhir.default_encoding=json
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.allow_multiple_delete=false
      - hapi.fhir.reuse_cached_search_results_millis=-1
      - JAVA_TOOL_OPTIONS=-Xmx1536m
    volumes:
      - hapi-data:/data/hapi
    networks:
      - cql-network
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cql-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cql-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    depends_on:
      - prometheus
    networks:
      - cql-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  taiwan-fhir-generator:
    profiles: [twcore]
    build:
      context: ../TWCOREDATA
      dockerfile: Dockerfile
    container_name: taiwan-fhir-generator
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - FHIR_SERVER_URL=${FHIR_SERVER_URL}
    volumes:
      - ../TWCOREDATA/output:/app/output
      - ../TWCOREDATA/config:/app/config
    depends_on:
      hapi-fhir:
        condition: service_started
    networks:
      - cql-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  cql-network:
    driver: bridge

volumes:
  postgres-data:
  postgres-backup:
  hapi-data:
  ollama-data:
  prometheus-data:
  grafana-data:
