groups:
  - name: cql-platform-alerts
    rules:
      # High HTTP error rate (>5% of requests returning 5xx over 5 minutes)
      - alert: HighErrorRate
        expr: |
          (
            rate(http_server_requests_seconds_count{status=~"5..",application="cql-platform"}[5m])
            /
            rate(http_server_requests_seconds_count{application="cql-platform"}[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate detected"
          description: "More than 5% of HTTP requests are returning 5xx errors for {{ $labels.uri }}"

      # P95 latency, tiered by endpoint cost profile (BUG-126). A single flat 5s
      # threshold false-fired on inherently slow endpoints: /api/cql/fix-suggestion
      # is an AI/LLM call (cloud timeout 60s), /api/cql/translate|validate are
      # CPU-bound cql2elm, /api/cql/execute runs CQL (timeout 120s). PromQL now uses
      # `sum by (le, uri)` for a correct per-endpoint P95.
      #
      # Tier 1 — general endpoints: 5s.
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le, uri) (rate(http_server_requests_seconds_bucket{application="cql-platform", uri!~"/api/cql/(fix-suggestion|translate|validate|execute)"}[5m]))
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency detected"
          description: "P95 latency is above 5 seconds for {{ $labels.uri }}"

      # Tier 2 — CQL compilation (cql2elm, CPU-bound): 15s.
      - alert: HighLatencyCqlCompile
        expr: |
          histogram_quantile(0.95,
            sum by (le, uri) (rate(http_server_requests_seconds_bucket{application="cql-platform", uri=~"/api/cql/(translate|validate)"}[5m]))
          ) > 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on CQL compilation"
          description: "P95 latency is above 15 seconds for {{ $labels.uri }} (cql2elm is CPU-bound; sustained means CPU contention or a cache miss storm)"

      # Tier 3 — long-running endpoints (AI suggestion, CQL execution): 30s.
      - alert: HighLatencyLongRunning
        expr: |
          histogram_quantile(0.95,
            sum by (le, uri) (rate(http_server_requests_seconds_bucket{application="cql-platform", uri=~"/api/cql/(fix-suggestion|execute)"}[5m]))
          ) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on long-running endpoint"
          description: "P95 latency is above 30 seconds for {{ $labels.uri }} (AI suggestion / CQL execution, near their request timeouts)"

      # CQL execution failures
      - alert: CqlExecutionFailures
        expr: rate(cql_execution_errors_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "CQL execution failures detected"
          description: "CQL execution error rate is {{ $value }} errors/second"

      # CDS invocation failures
      - alert: CdsInvocationFailures
        expr: rate(cds_invocation_errors_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "CDS invocation failures detected"
          description: "CDS invocation error rate is {{ $value }} errors/second"

      # Service down (no scrape for 1 minute)
      - alert: ServiceDown
        expr: up{job="cql-platform"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CQL Platform service is down"
          description: "The CQL Platform backend has been unreachable for more than 1 minute"

      # High JVM heap usage (>85%)
      - alert: HighHeapUsage
        expr: |
          (
            jvm_memory_used_bytes{area="heap",application="cql-platform"}
            /
            jvm_memory_max_bytes{area="heap",application="cql-platform"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage"
          description: "JVM heap usage is above 85% (current: {{ $value | humanizePercentage }})"

      # Measure evaluation failures
      - alert: MeasureEvaluationFailures
        expr: rate(measure_evaluation_errors_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Measure evaluation failures detected"
          description: "Measure evaluation error rate is {{ $value }} errors/second"

      # FHIR Circuit Breaker Open
      - alert: FhirCircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FHIR circuit breaker is OPEN"
          description: "Circuit breaker {{ $labels.name }} has been open for >1m. FHIR server may be down."

      # High FHIR Retry Rate
      - alert: HighFhirRetryRate
        expr: rate(resilience4j_retry_calls_total{kind="successful_with_retry"}[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High FHIR retry rate detected"
          description: "Retry rate for {{ $labels.name }} is {{ $value }}/s - FHIR server may be degraded"

      # CQL Queue Saturation
      - alert: CqlQueueSaturation
        expr: cql_execution_queue_size > 40
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CQL execution queue is saturated"
          description: "CQL execution queue depth is {{ $value }} (capacity: 50). Consider scaling."

      # Measure Report Deserialization Failure — silent data corruption / schema drift.
      # Counter is cumulative per JVM; any increase in a 10-minute window means at least
      # one historical report can no longer be loaded (null evaluationResult → empty dashboard).
      - alert: MeasureReportDeserializationFailure
        expr: increase(measure_report_deserialization_failures[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "measure_report deserialization failure detected"
          description: "{{ $value }} measure_report row(s) failed JSON deserialization in the last 10m. Likely schema drift in MeasureEvaluationResult — check backend logs for WARN entries with report id and run the corresponding data migration."

      # HikariCP connection-pool pressure — threads are waiting to check out a DB connection.
      # Any pending > 3 under steady load means pool saturation is imminent; alert before timeouts start.
      - alert: HikariConnectionPoolPending
        expr: hikaricp_connections_pending{application="cql-platform"} > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP connection pool is saturating"
          description: "{{ $value }} thread(s) waiting for a DB connection for 2m. Max pool size is 20; investigate slow queries or scale the pool."

      # HikariCP connection acquisition timed out — requests already failing. Non-zero
      # rate means 5xx responses due to DB-connection starvation.
      - alert: HikariConnectionTimeout
        expr: increase(hikaricp_connections_timeout_total{application="cql-platform"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP connection timeout"
          description: "{{ $value }} DB-connection acquisition(s) timed out in 5m. Requests are failing; scale the pool or reduce load immediately."

      # Patient import queue saturation — bulk EHR import backlog. Queue capacity 100;
      # sustained depth >80 means new bulk imports will be rejected (AbortPolicy → HTTP 503).
      - alert: PatientImportQueueSaturation
        expr: patient_import_queue_size > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Patient import queue is saturating"
          description: "Patient import queue depth is {{ $value }} (capacity: 100). New bulk imports will be rejected with 503 once the queue fills."

  # Infrastructure / host-level alerts (node-exporter). These close the gap where
  # the app-only Prometheus job was blind to the VM itself — the failure mode that
  # ends the "unbounded logs / WAL / local backups grow → disk full → postgres
  # write failure / corruption" chain with NO warning until postgres already broke.
  - name: infrastructure-alerts
    rules:
      # Root filesystem running low. 15% free on a 96G disk ≈ 14G left — act soon.
      - alert: DiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space low"
          description: "Root filesystem has {{ $value | humanizePercentage }} free. Check /var/lib/docker (container logs), /backups/wal, and postgres-backup/ growth."

      # Emergency: <5% free. postgres write failure / corruption is imminent.
      - alert: DiskSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
          ) < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host disk space CRITICAL"
          description: "Root filesystem has only {{ $value | humanizePercentage }} free. PostgreSQL writes may fail and corrupt data. Free space NOW."

      # The daily DB backup has not succeeded in >26h (timer is daily; 26h gives a
      # one-cycle grace). Fed by backup-db.sh writing a node-exporter textfile metric.
      - alert: BackupStale
        expr: time() - cql_backup_last_success_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Database backup is stale"
          description: "Last successful pg_dump was {{ $value | humanizeDuration }} ago (threshold 26h). The daily backup timer may have stopped — check `systemctl status cql-db-backup.timer` on the VM."

      # The backup freshness metric is absent entirely — either the backup has NEVER
      # run, or the node-exporter textfile collector can't read it. Either way we are
      # flying blind on backups, which is exactly the pre-incident state.
      - alert: BackupMetricMissing
        expr: absent(cql_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Backup freshness metric missing"
          description: "cql_backup_last_success_timestamp_seconds is absent. The daily backup may never have run, or node-exporter's textfile collector is misconfigured. Verify the backup timer and /opt/CQL/docker/node-exporter-textfile."

      # Host metrics collector itself down — we lose disk visibility (and the disk
      # alerts silently stop evaluating). Monitor the monitor.
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter is down"
          description: "Host-level metrics have been unreachable for >5m. DiskSpaceLow/Critical cannot fire while this is down."
