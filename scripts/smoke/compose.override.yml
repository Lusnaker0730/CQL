# Isolated compose overlay for the smoke test harness.
#
# Run via scripts/smoke/run.sh — the wrapper handles port-conflict detection,
# env wiring, and teardown.
#
# Rationale:
#   - Project name "smoke" (set by run.sh via `docker compose -p smoke`)
#     prefixes containers/networks/volumes so teardown is clean and nothing
#     leaks into a regular dev stack.
#   - `tmpfs` on postgres makes teardown instant and guarantees no
#     cross-run state leaks. Flyway re-runs on every `up`; DataInitializer
#     re-seeds admin/demo users.
#   - Monitoring + frontend disabled via `profiles: [disabled]` — we hit the
#     backend API directly.
#   - Host ports default to the 18xxx range to avoid colliding with dev stacks
#     or local postgres on 5432. Override per-run via env:
#       SMOKE_BACKEND_PORT=18080 SMOKE_FHIR_PORT=18081 SMOKE_PG_PORT=18432 run.sh

services:
  postgres:
    ports: !override
      - "${SMOKE_PG_PORT:-18432}:5432"
    volumes: !override
      - smoke_pg_data:/var/lib/postgresql/data
      # `!override` replaces the base list, so re-mount the init scripts: this is
      # what creates the RLS app role (PAT-223) on the fresh tmpfs volume. Relative
      # paths resolve against the PROJECT directory (docker/, where the first compose
      # file lives), not against this file.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  backend:
    ports: !override
      - "${SMOKE_BACKEND_PORT:-18080}:8080"
    environment:
      - APP_COMMIT_SHA=smoke-test
      # The harness drives the whole suite as the seeded `admin`, from one IP,
      # far faster than a human: 31 scenarios ≈ 150+ authenticated calls in a
      # few minutes. The production-tuned per-IP / per-user / per-tenant
      # ceilings (RATE_LIMIT_*; BUG-087, PAT-107, PAT-213) 429'd scenarios
      # 24–31 on the first CI run (`rate limit exceeded for user: admin tier:
      # DEFAULT`). Lift them HERE ONLY — this overlay never reaches production.
      # Values stay finite so the filters still execute; nothing is disabled.
      - RATE_LIMIT_RPM=100000
      - RATE_LIMIT_TRANSLATE_RPM=100000
      - RATE_LIMIT_EXECUTE_RPM=100000
      - RATE_LIMIT_FIX_SUGGESTION_RPM=100000
      - RATE_LIMIT_LIBRARY_READ_RPM=100000
      - RATE_LIMIT_CDS_DISCOVERY_RPM=100000
      - RATE_LIMIT_USER_TRANSLATE_RPM=100000
      - RATE_LIMIT_USER_EXECUTE_RPM=100000
      - RATE_LIMIT_USER_FIX_SUGGESTION_RPM=100000
      - RATE_LIMIT_USER_DEFAULT_RPM=100000
      - RATE_LIMIT_TENANT_TRANSLATE_RPM=100000
      - RATE_LIMIT_TENANT_EXECUTE_RPM=100000
      - RATE_LIMIT_TENANT_FIX_SUGGESTION_RPM=100000
      - RATE_LIMIT_TENANT_DEFAULT_RPM=100000
      # cds-invoke-rpm / auth-rpm have no ${...} placeholder in application.yml
      # (RateLimitProperties defaults 10 / 10) — Spring's relaxed binding maps the
      # env form RATE_LIMIT_CDSINVOKERPM onto rate-limit.cds-invoke-rpm directly.
      - RATE_LIMIT_CDSINVOKERPM=100000
      - RATE_LIMIT_AUTHRPM=100000

  hapi-fhir:
    ports: !override
      - "${SMOKE_FHIR_PORT:-18081}:8080"
    # Enable server-level $expunge so the smoke harness can wipe FHIR state between
    # scenarios without restarting the container. These settings are intentionally
    # ONLY in the smoke overlay — production HAPI keeps them off (allow_multiple_delete
    # and expunge_enabled are destructive operations that shouldn't exist in prod).
    environment:
      - hapi.fhir.expunge_enabled=true
      - hapi.fhir.allow_multiple_delete=true

  frontend:
    profiles:
      - disabled
  prometheus:
    profiles:
      - disabled
  grafana:
    profiles:
      - disabled
  alertmanager:
    profiles:
      - disabled

# Fresh volume per smoke project; `docker compose down -v` wipes it cleanly.
volumes:
  smoke_pg_data:
