openapi: 3.0.3
info:
  title: CQL 平台 API
  version: 1.0.0
  description: |
    CQL 平台後端 API — 涵蓋 CQL 編輯/執行、品質指標管理、FHIR 資源操作、
    CDS 決策支援、權限管理等完整功能。
  contact:
    name: CQL Platform
servers:
  - url: /
    description: 本地開發環境

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 認證 — 登入、註冊、SSO、密碼管理
  - name: cql
    description: CQL 操作 — 翻譯、驗證、執行
  - name: cql-libraries
    description: CQL 函式庫 — CRUD、版本、分享、相依性
  - name: measures
    description: 品質指標 — 定義 CRUD
  - name: measures-eval
    description: 品質指標 — 評估與報告
  - name: measures-testcases
    description: 品質指標 — 測試案例
  - name: measures-workflow
    description: 品質指標 — 工作流程與版本
  - name: measures-dashboard
    description: 品質指標 — 儀表板與趨勢
  - name: fhir
    description: FHIR 資源 — 瀏覽、CRUD、術語服務
  - name: fhir-ig
    description: FHIR — Implementation Guide 瀏覽
  - name: fhir-vsac
    description: FHIR — VSAC 整合
  - name: cds-config
    description: CDS 服務管理
  - name: cds-hooks
    description: CDS Hooks 執行
  - name: authoring
    description: CDS 撰寫工具 — 工件管理與 CQL 生成
  - name: ehr
    description: EHR 整合 — 連線與病患匯入
  - name: admin
    description: 使用者管理（需 ADMIN 角色）
  - name: audit
    description: 稽核日誌（需 ADMIN 角色）
  - name: departments
    description: 部門管理
  - name: indicators
    description: 指標目錄
  - name: notifications
    description: 通知管理
  - name: settings
    description: 系統設定
  - name: api-keys
    description: API 金鑰管理
  - name: user-prefs
    description: 使用者偏好（最愛與最近存取）
  - name: smart
    description: SMART on FHIR 設定

paths:
  # ===== Auth =====
  /api/auth/login:
    post:
      tags: [auth]
      summary: 使用者登入
      description: 使用帳號密碼登入，取得 JWT Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/register:
    post:
      tags: [auth]
      summary: 使用者註冊
      description: 註冊新帳號
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 註冊成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 使用者名稱已存在

  /api/auth/me:
    get:
      tags: [auth]
      summary: 取得目前使用者
      description: 回傳已認證使用者的個人資訊
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'

  /api/auth/forgot-password:
    post:
      tags: [auth]
      summary: 忘記密碼
      description: 發送密碼重設信件
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: 請求已處理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: 重設密碼
      description: 透過重設 token 設定新密碼
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 密碼已重設
        '400':
          description: 令牌無效或過期

  /api/auth/change-password:
    post:
      tags: [auth]
      summary: 變更密碼
      description: 已登入使用者變更自己的密碼
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密碼已變更
        '400':
          description: 目前密碼不正確

  /api/auth/okta/config:
    get:
      tags: [auth]
      summary: 取得 Okta SSO 設定
      description: 查詢 Okta SSO 是否啟用及設定資訊
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OktaConfig'

  /api/auth/okta/callback:
    post:
      tags: [auth]
      summary: Okta SSO 回呼
      description: Okta OIDC 授權碼交換，自動 JIT 建立使用者
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OktaCallbackRequest'
      responses:
        '200':
          description: 認證成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: SSO 認證失敗

  # ===== CQL Operations =====
  /api/cql/translate:
    post:
      tags: [cql]
      summary: 翻譯 CQL
      description: 將 CQL 程式碼翻譯為 ELM 格式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CqlTranslationRequest'
      responses:
        '200':
          description: 翻譯結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlTranslationResponse'

  /api/cql/validate:
    post:
      tags: [cql]
      summary: 驗證 CQL
      description: 驗證 CQL 語法與語義正確性
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cql]
              properties:
                cql:
                  type: string
                  description: CQL 原始碼
      responses:
        '200':
          description: 驗證結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlTranslationResponse'

  /api/cql/execute:
    post:
      tags: [cql]
      summary: 執行 CQL
      description: 對 FHIR 伺服器執行 CQL 查詢
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CqlExecutionRequest'
      responses:
        '200':
          description: 執行結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlExecutionResponse'

  # ===== CQL Libraries =====
  /api/cql/libraries:
    get:
      tags: [cql-libraries]
      summary: 列出 CQL 函式庫
      description: 回傳所有已儲存的 CQL 函式庫
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: 搜尋關鍵字
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CqlLibrary'
    post:
      tags: [cql-libraries]
      summary: 建立 CQL 函式庫
      description: 建立新的 CQL 函式庫
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibrarySaveRequest'
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/{id}:
    get:
      tags: [cql-libraries]
      summary: 取得函式庫
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'
        '404':
          description: 找不到
    put:
      tags: [cql-libraries]
      summary: 更新函式庫
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibrarySaveRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'
    delete:
      tags: [cql-libraries]
      summary: 刪除函式庫
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 已刪除

  /api/cql/libraries/latest/{name}:
    get:
      tags: [cql-libraries]
      summary: 取得最新版本
      description: 依函式庫名稱取得最新版本
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/versions/{name}:
    get:
      tags: [cql-libraries]
      summary: 列出所有版本
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/metadata:
    get:
      tags: [cql-libraries]
      summary: 取得函式庫中繼資料
      description: 回傳所有函式庫的輕量中繼資料
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryMetadataDTO'

  /api/cql/libraries/{id}/fhir:
    get:
      tags: [cql-libraries]
      summary: 匯出為 FHIR Library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: FHIR Library 資源
          content:
            application/json:
              schema:
                type: object

  /api/cql/libraries/import/fhir:
    post:
      tags: [cql-libraries]
      summary: 匯入 FHIR Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: FHIR R4 Library 資源 JSON
      responses:
        '200':
          description: 匯入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/repository:
    get:
      tags: [cql-libraries]
      summary: 列出範本庫
      description: 列出可供匯入的預建 CQL 函式庫範本
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    category:
                      type: string

  /api/cql/libraries/repository/{name}/import:
    post:
      tags: [cql-libraries]
      summary: 匯入範本庫
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 匯入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/{name}/version:
    post:
      tags: [cql-libraries]
      summary: 建立新版本
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [major, minor, patch]
            default: minor
          description: 版本類型
      responses:
        '200':
          description: 新版本已建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/{name}/history:
    get:
      tags: [cql-libraries]
      summary: 版本歷史
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/compare:
    get:
      tags: [cql-libraries]
      summary: 比較版本
      parameters:
        - name: oldId
          in: query
          required: true
          schema:
            type: string
        - name: newId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  oldCql:
                    type: string
                  newCql:
                    type: string

  /api/cql/libraries/{id}/share:
    post:
      tags: [cql-libraries]
      summary: 分享函式庫
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameRequest'
      responses:
        '200':
          description: 已分享
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/{id}/unshare:
    post:
      tags: [cql-libraries]
      summary: 取消分享
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameRequest'
      responses:
        '200':
          description: 已取消分享
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/{id}/transfer:
    post:
      tags: [cql-libraries]
      summary: 轉移擁有權
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: 已轉移
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/{id}/access:
    put:
      tags: [cql-libraries]
      summary: 設定存取層級
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessUpdateRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/owner/{username}:
    get:
      tags: [cql-libraries]
      summary: 依擁有者列出
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/shared/{username}:
    get:
      tags: [cql-libraries]
      summary: 列出分享函式庫
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/{id}/dependencies:
    get:
      tags: [cql-libraries]
      summary: 取得相依性
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/dependents/{name}:
    get:
      tags: [cql-libraries]
      summary: 取得被依賴者
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CqlLibrary'

  /api/cql/libraries/{id}/dependency-analysis:
    get:
      tags: [cql-libraries]
      summary: 相依性分析
      description: 分析函式庫的相依性衝突與版本不一致問題
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                description: 相依性分析結果

  # ===== User Library Prefs =====
  /api/cql/user-prefs/favorites:
    get:
      tags: [user-prefs]
      summary: 列出我的最愛
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    libraryId:
                      type: string
                    libraryName:
                      type: string
                    libraryVersion:
                      type: string
                    createdAt:
                      type: string
                      format: date-time

  /api/cql/user-prefs/favorites/{libraryId}:
    post:
      tags: [user-prefs]
      summary: 加入最愛
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 已加入
    delete:
      tags: [user-prefs]
      summary: 移除最愛
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 已移除

  /api/cql/user-prefs/recent:
    get:
      tags: [user-prefs]
      summary: 列出最近存取
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    libraryId:
                      type: string
                    libraryName:
                      type: string
                    libraryVersion:
                      type: string
                    accessedAt:
                      type: string
                      format: date-time
    delete:
      tags: [user-prefs]
      summary: 清除最近存取
      responses:
        '204':
          description: 已清除

  /api/cql/user-prefs/recent/{libraryId}:
    post:
      tags: [user-prefs]
      summary: 記錄最近存取
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 已記錄

  # ===== Measures CRUD =====
  /api/measures:
    get:
      tags: [measures]
      summary: 列出所有指標
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: 搜尋關鍵字
        - name: department
          in: query
          schema:
            type: string
          description: 部門代碼篩選
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasureDefinition'
    post:
      tags: [measures]
      summary: 建立指標
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasureDefinition'
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureDefinition'

  /api/measures/{id}:
    get:
      tags: [measures]
      summary: 取得指標
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureDefinition'
        '404':
          description: 找不到
    put:
      tags: [measures]
      summary: 更新指標
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasureDefinition'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureDefinition'
    delete:
      tags: [measures]
      summary: 刪除指標
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 已刪除

  # ===== Measures FHIR Import/Export =====
  /api/measures/import/fhir:
    post:
      tags: [measures]
      summary: 匯入 FHIR Measure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 匯入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureDefinition'

  /api/measures/{id}/fhir:
    get:
      tags: [measures]
      summary: 匯出為 FHIR Measure
      parameters:
        - name: id
          in: path
          required: true
          schema:
