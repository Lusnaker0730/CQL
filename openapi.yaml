components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 認證

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 錯誤訊息

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 使用者帳號
        password:
          type: string
          description: 密碼

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: 帳號
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: 密碼
        email:
          type: string
          description: 電子信箱

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Token
        username:
          type: string
        role:
          type: string
          enum: [USER, DEPARTMENT_ADMIN, ADMIN]
        expiresIn:
          type: integer
          format: int64
          description: 過期時間（毫秒）
        forcePasswordChange:
          type: boolean

    UserInfo:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        role:
          type: string
        forcePasswordChange:
          type: boolean
        authProvider:
          type: string
          enum: [LOCAL, OKTA]
        displayName:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    OktaConfig:
      type: object
      properties:
        enabled:
          type: boolean
        authorizationEndpoint:
          type: string
