name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  # --- Job 1: Build & Push Images to GHCR ---
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      image-tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --- Job 2: Verify Database Migrations ---
  verify-migrations:
    name: Verify DB Migrations
    runs-on: ubuntu-latest
    needs: [build-and-push]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cqlplatform_test
          POSTGRES_USER: ${{ secrets.CI_PG_USER || 'cqltest' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_PG_PASSWORD || 'cqltest' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Flyway migrate & validate
        working-directory: backend
        run: |
          mvn flyway:migrate flyway:validate -B \
            -Dflyway.url=jdbc:postgresql://localhost:5432/cqlplatform_test \
            -Dflyway.user=${{ secrets.CI_PG_USER || 'cqltest' }} \
            -Dflyway.password=${{ secrets.CI_PG_PASSWORD || 'cqltest' }} \
            -Dflyway.locations=classpath:db/migration

  # --- Job 3: Notify ---
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-push, verify-migrations]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.build-and-push.result }}" == "success" && "${{ needs.verify-migrations.result }}" == "success" ]]; then
            echo "emoji=:white_check_mark:" >> "$GITHUB_OUTPUT"
            echo "text=Build & push succeeded — images available on GHCR" >> "$GITHUB_OUTPUT"
            echo "color=good" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
            echo "text=Build or migration verification failed" >> "$GITHUB_OUTPUT"
            echo "color=danger" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"${{ steps.status.outputs.color }}\",
                \"title\": \"${{ steps.status.outputs.emoji }} CQL Platform Deploy\",
                \"text\": \"${{ steps.status.outputs.text }}\",
                \"fields\": [
                  {\"title\": \"Tag\", \"value\": \"${{ needs.build-and-push.outputs.image-tag }}\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Actor\", \"value\": \"${{ github.actor }}\", \"short\": true}
                ]
              }]
            }"
