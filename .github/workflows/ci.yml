name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: backend
        run: mvn verify -B -Dspring.profiles.active=test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/TEST-*.xml
          retention-days: 30

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            backend/target/site/jacoco/
            backend/target/jacoco.exec
          retention-days: 30

      - name: Summarize coverage in job log
        if: always()
        working-directory: backend
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "### JaCoCo Coverage" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            awk -F',' 'NR>1 { im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9; mm+=$12; mc+=$13; }
              END {
                printf "Instructions: %.1f%% (%d/%d)\n", 100*ic/(im+ic), ic, im+ic;
                printf "Branches:     %.1f%% (%d/%d)\n", 100*bc/(bm+bc), bc, bm+bc;
                printf "Lines:        %.1f%% (%d/%d)\n", 100*lc/(lm+lc), lc, lm+lc;
                printf "Methods:      %.1f%% (%d/%d)\n", 100*mc/(mm+mc), mc, mm+mc;
              }' target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: i18n locale sync check
        working-directory: frontend
        run: python scripts/check-i18n-sync.py

      - name: CQL grammar token drift check
        working-directory: frontend
        run: python scripts/generate-monarch-tokens.py --check

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Run tests with JSON reporter
        working-directory: frontend
        run: npx vitest run --reporter=json --outputFile=test-results.json

      - name: Upload Vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: frontend/test-results.json
          retention-days: 30

  migration-test:
    name: PostgreSQL Migration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cqlplatform_test
          POSTGRES_USER: ${{ secrets.CI_PG_USER || 'cqltest' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_PG_PASSWORD || 'cqltest' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Flyway migrations + JPA validate
        working-directory: backend
        env:
          CI_PG_TEST: 'true'
        run: |
          mvn test -B \
            -Dspring.profiles.active=ci-pg \
            -Dtest=com.cqlplatform.CqlPlatformApplicationTest \
            -DfailIfNoTests=false

      - name: Flyway validate (standalone)
        working-directory: backend
        run: |
          mvn flyway:validate -B \
            -Dflyway.url=jdbc:postgresql://localhost:5432/cqlplatform_test \
            -Dflyway.user=${{ secrets.CI_PG_USER || 'cqltest' }} \
            -Dflyway.password=${{ secrets.CI_PG_PASSWORD || 'cqltest' }} \
            -Dflyway.locations=classpath:db/migration

      - name: Verify rollback scripts exist
        run: |
          # Count SQL migrations + Java migrations (PAT-163 V56 introduced the
          # first Java migration; future Java ones will be picked up automatically).
          SQL_MIGRATIONS=$(ls -1 backend/src/main/resources/db/migration/V*.sql 2>/dev/null | wc -l)
          JAVA_MIGRATIONS=$(ls -1 backend/src/main/java/db/migration/V*.java 2>/dev/null | wc -l)
          MIGRATION_COUNT=$((SQL_MIGRATIONS + JAVA_MIGRATIONS))
          ROLLBACK_COUNT=$(ls -1 backend/src/main/resources/db/rollback/rollback_V*.sql | wc -l)
          echo "SQL migrations:     $SQL_MIGRATIONS"
          echo "Java migrations:    $JAVA_MIGRATIONS"
          echo "Forward (total):    $MIGRATION_COUNT"
          echo "Rollback scripts:   $ROLLBACK_COUNT"
          if [ "$MIGRATION_COUNT" -ne "$ROLLBACK_COUNT" ]; then
            echo "::error::Missing rollback scripts! $MIGRATION_COUNT migrations but only $ROLLBACK_COUNT rollback scripts."
            exit 1
          fi
          echo "All migrations have corresponding rollback scripts."

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: cql-platform/backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: cql-platform/frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v7

      # Trivy's pom.xml analyzer resolves the full dependency tree by fetching
      # POMs; against oss.sonatype.org (declared for the cqframework artifacts) it
      # intermittently gets HTTP 429 and FATALs the whole scan. Restore the Maven
      # cache that backend-test populated (this job `needs: backend-test`) and
      # pre-resolve so Trivy reads POMs from ~/.m2 locally instead of hammering the
      # remote repo. See: "populate the local Maven cache before scanning".
      - name: Set up JDK 21 (restore Maven cache for Trivy)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Pre-resolve backend dependencies into ~/.m2
        working-directory: backend
        run: mvn -B -q dependency:go-offline || true

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'backend/.trivyignore'

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'frontend/.trivyignore'

  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image for scanning
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: cql-platform/backend:scan
          cache-from: type=gha,scope=backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cql-platform/backend:scan'
          format: 'sarif'
          output: 'backend-trivy.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'backend-trivy.sarif'
          category: 'trivy-backend-image'

      - name: Build frontend image for scanning
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: cql-platform/frontend:scan
          cache-from: type=gha,scope=frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cql-platform/frontend:scan'
          format: 'sarif'
          output: 'frontend-trivy.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload frontend scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'frontend-trivy.sarif'
          category: 'trivy-frontend-image'
