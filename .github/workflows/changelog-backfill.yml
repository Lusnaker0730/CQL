name: CHANGE_LOG Hash Backfill

# Eliminates the manual "docs: add commit hash" 2nd commit per PR described in
# CLAUDE.md. When a PR merges to main with an empty commit column in CHANGE_LOG,
# this workflow fills in the hash(es) of the commit(s) that referenced the
# PAT/BUG id in their message, then opens a PR back to main with the change.
#
# Triggers on any push to main (PR merges, direct pushes). Skips itself if the
# pushing author is the bot (prevents infinite loops).
#
# Why a PR and not direct push: main has branch protection (PRs required +
# status checks). Previously this workflow tried `git push origin main` and
# was rejected (#564 post-merge run failed with GH013). Opening a PR respects
# protection. Token: pushes + `gh pr create` use the CHANGELOG_PAT secret
# (fine-grained PAT, this repo only: Contents R/W + Pull requests R/W) when it
# is set, because PRs created with GITHUB_TOKEN do NOT trigger other workflows
# (GitHub security policy against recursion) and main's ruleset requires four
# status checks with no bypass — #848 sat BLOCKED for that reason. If the
# secret is missing/expired it falls back to GITHUB_TOKEN and a human must
# push an empty commit (or close + reopen) to trigger the checks (PAT-225).

on:
  push:
    branches: [main]
    paths:
      # Trigger only when main's commits could plausibly change the state we
      # care about — the changelog itself, or any source file (a source-change
      # PR is what creates the empty row that needs filling).
      - 'docs/CHANGE_LOG.md'
      - '**.java'
      - '**.ts'
      - '**.tsx'
      - '**.sh'

permissions:
  contents: write       # push branch
  pull-requests: write  # open PR

jobs:
  backfill:
    name: Backfill commit hashes
    runs-on: ubuntu-latest

    # Skip if the triggering commit is itself the backfill PR being merged —
    # stops self-feedback loop. The bot's PR will have title prefix
    # "docs: backfill commit hashes" — head_commit.message reflects the squash
    # title on merge.
    # NOTE: double-quoted so YAML doesn't parse the leading `!` as a tag
    # indicator and doesn't treat `: ` inside the string literal as a mapping.
    if: "${{ github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'docs: backfill commit hashes') }}"

    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          # Need history so `git log --grep` can find the commits referenced
          # in CHANGE_LOG. fetch-depth:0 fetches everything.
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run backfill script
        id: backfill
        run: |
          python .github/scripts/changelog-backfill.py

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_PAT || secrets.GITHUB_TOKEN }}
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_MSG: ${{ github.event.head_commit.message }}
        run: |
          if git diff --quiet docs/CHANGE_LOG.md; then
            echo "No changes — nothing to backfill."
            exit 0
          fi

          # Stable branch name so re-runs update the same PR instead of
          # spawning duplicates. If a PR is already open and not merged, we
          # force-push to update it with the latest backfill state.
          BRANCH="chore/changelog-backfill"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/CHANGE_LOG.md
          git commit -m "docs: backfill commit hashes into CHANGE_LOG" \
            -m "Auto-generated by .github/workflows/changelog-backfill.yml after merge of $TRIGGER_SHA. Replaces the manual 2-commit pattern (add row, then 'docs: add commit hash') described in CLAUDE.md."
          git push --force origin "$BRANCH"

          # If a PR for this branch already exists, leave it (the force-push
          # above updated it). Otherwise open a new one.
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "PR for $BRANCH already open — updated via force-push."
            exit 0
          fi

          # First line of the triggering commit, for the PR body context.
          TRIGGER_FIRST_LINE=$(printf '%s' "$TRIGGER_MSG" | head -n1)

          # Build body in a tempfile to avoid YAML block-scalar termination
          # issues with `>` at column 0. `>` is a markdown blockquote here.
          BODY_FILE=$(mktemp)
          {
            echo "Auto-generated by [\`changelog-backfill.yml\`](.github/workflows/changelog-backfill.yml) after merging \`$TRIGGER_SHA\`:"
            echo
            echo "> $TRIGGER_FIRST_LINE"
            echo
            echo "Fills in the commit hash column in \`docs/CHANGE_LOG.md\` for any PAT-NNN / BUG-NNN row whose hash was left empty. Safe to merge once CI is green."
            echo
            echo "**Note:** opened with the \`CHANGELOG_PAT\` secret when configured, so required checks run on their own. If this PR shows no CI checks, the secret is missing or expired — push an empty commit to the branch (or close + reopen) to trigger them, then renew the secret (PAT-225)."
            echo
            echo "🤖 Auto-generated"
          } > "$BODY_FILE"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: backfill commit hashes" \
            --body-file "$BODY_FILE"
