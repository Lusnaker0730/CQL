name: CHANGE_LOG Hash Backfill

# Eliminates the manual "docs: add commit hash" 2nd commit per PR described in
# CLAUDE.md. When a PR merges to main with an empty commit column in CHANGE_LOG,
# this workflow fills in the hash(es) of the commit(s) that referenced the
# PAT/BUG id in their message, then commits the change back to main.
#
# Triggers on any push to main (PR merges, direct pushes). Skips itself if the
# pushing author is the bot (prevents infinite loops).

on:
  push:
    branches: [main]
    paths:
      # Trigger only when main's commits could plausibly change the state we
      # care about — the changelog itself, or any source file (a source-change
      # PR is what creates the empty row that needs filling).
      - 'docs/CHANGE_LOG.md'
      - '**.java'
      - '**.ts'
      - '**.tsx'
      - '**.sh'

permissions:
  contents: write  # needs write to push the backfill commit

jobs:
  backfill:
    name: Backfill commit hashes
    runs-on: ubuntu-latest

    # Skip if the commit that triggered this workflow is itself a backfill —
    # stops self-feedback loop. `github-actions[bot]` is the automatic committer
    # identity used below.
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          # Need history so `git log --grep` can find the commits referenced
          # in CHANGE_LOG. fetch-depth:0 fetches everything.
          fetch-depth: 0
          # Use the default GITHUB_TOKEN; permissions: contents:write above
          # lets us push back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run backfill script
        id: backfill
        run: |
          python .github/scripts/changelog-backfill.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/CHANGE_LOG.md; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGE_LOG.md
          git commit -m "docs: backfill commit hashes into CHANGE_LOG" \
            -m "Auto-generated by .github/workflows/changelog-backfill.yml — see .github/scripts/changelog-backfill.py. Replaces the manual 2-commit pattern (add row, then 'docs: add commit hash') described in CLAUDE.md."
          git push origin main
