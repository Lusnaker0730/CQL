apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cql-platform
  labels:
    app: prometheus
    app.kubernetes.io/part-of: cql-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'cql-platform-backend'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets: ['backend:8080']
            labels:
              application: 'cql-platform'
