# Secret template - replace placeholder values before applying
# Generate base64 values: echo -n 'value' | base64
# DO NOT commit this file with real secrets
apiVersion: v1
kind: Secret
metadata:
  name: cql-platform-secrets
  namespace: cql-platform
  labels:
    app.kubernetes.io/part-of: cql-platform
type: Opaque
data:
  # echo -n 'cqlplatform' | base64
  DB_USERNAME: CHANGE_ME_base64_encoded
  DB_PASSWORD: CHANGE_ME_base64_encoded
  POSTGRES_USER: CHANGE_ME_base64_encoded
  POSTGRES_PASSWORD: CHANGE_ME_base64_encoded
  JWT_SECRET: CHANGE_ME_base64_encoded
  ENCRYPTION_KEY: CHANGE_ME_base64_encoded
  GF_SECURITY_ADMIN_PASSWORD: CHANGE_ME_base64_encoded
