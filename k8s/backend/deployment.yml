apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cql-platform
  labels:
    app: backend
    app.kubernetes.io/part-of: cql-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: ghcr.io/OWNER/cql-platform/backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cql-platform-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cql-platform-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cql-platform-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cql-platform-secrets
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cql-platform-secrets
                  key: ENCRYPTION_KEY
            - name: VSAC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cql-platform-secrets
                  key: VSAC_API_KEY
            - name: OKTA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cql-platform-secrets
                  key: OKTA_CLIENT_ID
            - name: OKTA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cql-platform-secrets
                  key: OKTA_CLIENT_SECRET
            - name: OKTA_ISSUER
              valueFrom:
                secretKeyRef:
                  name: cql-platform-secrets
                  key: OKTA_ISSUER
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
